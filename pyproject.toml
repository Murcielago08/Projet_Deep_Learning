[project]
name = "deep-learning-ynov-j3"
version = "2026.10"
description = "Dépendances du TP3 (journée 3) du module Deep Learning, Ynov Bordeaux"
requires-python = ">=3.11,<3.13"
# Installation depuis ce dossier : pip install -e .   (ou : uv sync)
# Le pyproject.toml à la racine du cours regroupe tous les TP (pip install -e ".[tp3]").
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "jupyterlab>=4.1",
  "ipykernel>=6.29",
  "tqdm>=4.66",
  "torch>=2.2",
  "statsmodels>=0.14",
  "pmdarima>=2.0",
  "optuna>=3.6",
  ]

[tool.setuptools]
py-modules = []

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
